<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>VR-Test Cafeteria</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
    #info{position:fixed;z-index:10;left:16px;top:16px;max-width:360px;padding:14px 16px;border-radius:12px;background:rgba(20,24,30,.92);color:#fff}
    #info h1{font-size:19px;margin:0 0 8px}
    #info p{margin:7px 0;font-size:14px;line-height:1.35}
    #start{font:inherit;font-weight:700;padding:10px 15px;border:0;border-radius:9px;background:#55c96b;color:#08130a;cursor:pointer}
    #start:disabled{opacity:.5;cursor:not-allowed}
    #canvas{display:block;width:100%;height:100%}
    body.invr #info{display:none}
  </style>
</head>
<body>
  <div id="info">
    <h1>VR-Test – Cafeteria</h1>
    <p id="status">WebXR wird geprüft …</p>
    <button id="start" disabled>VR starten</button>
    <p>Testziel: 360°-Panorama ohne künstliche Cube-Schnittkanten, Umschauen per Kopfbewegung.</p>
  </div>
  <canvas id="canvas"></canvas>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";
import { VRButton } from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/webxr/VRButton.js";

const canvas = document.getElementById("canvas");
const status = document.getElementById("status");
const start = document.getElementById("start");

const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.xr.enabled = true;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1100);
camera.position.set(0,0,0);

const geometry = new THREE.SphereGeometry(100, 96, 64);
geometry.scale(-1,1,1);

const texture = await new THREE.TextureLoader().loadAsync("cafeteria.jpg");
texture.colorSpace = THREE.SRGBColorSpace;
const material = new THREE.MeshBasicMaterial({map:texture});
const sphere = new THREE.Mesh(geometry, material);
scene.add(sphere);

function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);
resize();

renderer.setAnimationLoop(() => renderer.render(scene,camera));

let vrButton;
if (navigator.xr) {
  try {
    const supported = await navigator.xr.isSessionSupported("immersive-vr");
    if (supported) {
      status.textContent = "Immersive VR wird unterstützt.";
      start.disabled = false;
      vrButton = VRButton.createButton(renderer, {
        optionalFeatures: ["local-floor", "bounded-floor"]
      });
      vrButton.style.display = "none";
      document.body.appendChild(vrButton);
      start.addEventListener("click", () => vrButton.click());
    } else {
      status.textContent = "Dieser Browser meldet keine Unterstützung für immersive VR.";
    }
  } catch(e) {
    status.textContent = "WebXR-Prüfung fehlgeschlagen: " + e.message;
  }
} else {
  status.textContent = "WebXR ist in diesem Browser nicht verfügbar.";
}

renderer.xr.addEventListener("sessionstart", () => document.body.classList.add("invr"));
renderer.xr.addEventListener("sessionend", () => document.body.classList.remove("invr"));
</script>
</body>
</html>
